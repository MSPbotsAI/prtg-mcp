[project]
name = "prtg-mcp"
version = "0.1.0"
description = "MCP server for PRTG Network Monitor (Paessler network/infrastructure monitoring)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.scripts]
prtg-mcp = "prtg_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prtg_mcp"]
